<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>GBA Shell Editor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #222; color: #eee; font-family: monospace; display: flex; height: 100vh; }
.preview { flex: 1; display: flex; align-items: center; justify-content: center; }
.preview svg { width: 90%; height: 90%; }
.panel { width: 400px; background: #1a1a1a; padding: 16px; overflow-y: auto; border-left: 2px solid #444; }
h2 { font-size: 13px; color: #f44; margin-bottom: 12px; }
.row { margin: 6px 0; }
.row label { font-size: 11px; color: #aaa; display: inline-block; width: 120px; }
.row input[type=range] { width: 200px; }
.row .v { color: #f44; font-size: 11px; width: 60px; display: inline-block; text-align: right; }
textarea { width: 100%; height: 120px; background: #111; color: #0f0; border: 1px solid #444; font-size: 10px; padding: 6px; margin-top: 10px; font-family: monospace; }
button { background: #f44; color: #fff; border: none; padding: 6px 14px; margin: 6px 4px 0 0; cursor: pointer; font-size: 11px; }
button:hover { background: #c33; }
</style>
</head>
<body>
<div class="preview">
  <svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="shell-clip">
        <path id="shell-path" fill-rule="evenodd" />
      </clipPath>
    </defs>
    <rect x="0" y="0" width="500" height="300" fill="#800000" rx="8"/>
    <g clip-path="url(#shell-clip)">
      <rect x="0" y="-20" width="500" height="340" fill="#8994af" opacity="0.7"/>
    </g>
    <path id="shell-outline" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.5"/>
    <text x="250" y="295" text-anchor="middle" fill="#666" font-size="8">GBA Shell Preview</text>
  </svg>
</div>
<div class="panel">
  <h2>GBA Shell Path Editor</h2>
  
  <div class="row"><label>搴曢儴鍦嗚</label><input type="range" id="r" min="30" max="100" value="65"><span class="v" id="vr">65</span></div>
  <div class="row"><label>搴曢儴璧风偣X</label><input type="range" id="bx" min="5" max="35" value="15"><span class="v" id="vbx">15</span></div>
  <div class="row"><label>鍗″甫瀹?鍗?</label><input type="range" id="cw" min="10" max="40" value="20"><span class="v" id="vcw">20</span></div>
  <div class="row"><label>鍗″甫楂樺害</label><input type="range" id="ch" min="1" max="10" value="4"><span class="v" id="vch">4</span></div>
  <div class="row"><label>鍑规Ы瀹?/label><input type="range" id="nw" min="3" max="20" value="10"><span class="v" id="vnw">10</span></div>
  <div class="row"><label>鍑规Ы楂?/label><input type="range" id="nh" min="2" max="40" value="10"><span class="v" id="vnh">10</span></div>
  <div class="row"><label>鍑规ЫY鍋忕Щ</label><input type="range" id="ny" min="0" max="30" value="5"><span class="v" id="vny">5</span></div>
  <div class="row"><label>鍑规Ы鍦嗚</label><input type="range" id="nr" min="1" max="8" value="2"><span class="v" id="vnr">2</span></div>
  
  <button onclick="copyPath()">澶嶅埗 Path</button>
  <button onclick="resetVals()">閲嶇疆</button>
  
  <textarea id="out" readonly></textarea>
  
  <p style="font-size:10px;color:#666;margin-top:10px">璋冨ソ鍚庣偣澶嶅埗锛屾妸璺緞鍙戠粰鎴戙€俁鍑规Ы鑷姩闀滃儚銆?/p>
</div>

<script>
var ids=['r','bx','cw','ch','nw','nh','ny','nr'];
var els={}, vels={};
ids.forEach(function(id){els[id]=document.getElementById(id);vels[id]=document.getElementById('v'+id)});

function P(){
  var r=+els.r.value, bx=+els.bx.value, cw=+els.cw.value, ch=+els.ch.value;
  var nw=+els.nw.value, nh=+els.nh.value, ny=+els.ny.value, nr=+els.nr.value;
  
  var cx=50, cartL=cx-cw, cartR=cx+cw;
  var nl=nw, nt=ny, nb=ny+nh;
  
  var d=[
    'M '+bx+',100',
    'C '+(bx*0.3)+',100 0,'+r+' 0,65',
    'L 0,'+nb,
    'C 0,'+(nb-nr)+' '+nr+','+(nb-2*nr)+' '+(2*nr)+','+(nb-2*nr),
    'L '+(nl-2*nr)+','+(nb-2*nr),
    'C '+(nl-nr)+','+(nb-2*nr)+' '+nl+','+(nb-nr)+' '+nl+','+nb,
    'L '+nl+','+(nt+2*nr),
    'C '+nl+','+(nt+nr)+' '+(nl-nr)+','+nt+' '+(nl-2*nr)+','+nt,
    'L '+(2*nr)+','+nt,
    'C '+nr+','+nt+' 0,'+(nt+nr)+' 0,'+(nt+2*nr),
    'L 0,0',
    'L '+cartL+',0',
    'C '+(cartL+5)+',-'+ch+' '+(cartL+12)+',-'+(ch*1.2)+' '+cx+',-'+(ch*1.2),
    'C '+(cartR-12)+',-'+(ch*1.2)+' '+(cartR-5)+',-'+ch+' '+cartR+',0',
    'L 100,0',
    'L 100,'+(nt+2*nr),
    'C 100,'+(nt+nr)+' '+(100-nr)+','+nt+' '+(100-2*nr)+','+nt,
    'L '+(100-nl+2*nr)+','+nt,
    'C '+(100-nl+nr)+','+nt+' '+(100-nl)+','+(nt+nr)+' '+(100-nl)+','+(nt+2*nr),
    'L '+(100-nl)+','+(nb-2*nr),
    'C '+(100-nl)+','+(nb-nr)+' '+(100-nl+nr)+','+(nb-2*nr)+' '+(100-nl+2*nr)+','+(nb-2*nr),
    'L '+(100-2*nr)+','+(nb-2*nr),
    'C '+(100-nr)+','+(nb-2*nr)+' 100,'+(nb-nr)+' 100,'+nb,
    'L 100,65',
    'C 100,'+r+' '+(100-bx*0.3)+',100 '+(100-bx)+',100',
    'Z'
  ].join(' ');
  return d;
}

function upd(){
  ids.forEach(function(id){vels[id].textContent=els[id].value});
  var d=P();
  document.getElementById('shell-path').setAttribute('d',d);
  document.getElementById('shell-outline').setAttribute('d',d);
  document.getElementById('out').value=d;
}

function copyPath(){
  var t=document.getElementById('out').value;
  if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){alert('Copied!')})}
  else{document.getElementById('out').select();document.execCommand('copy');alert('Copied!')}
}

function resetVals(){
  els.r.value=65;els.bx.value=15;els.cw.value=20;els.ch.value=4;
  els.nw.value=10;els.nh.value=10;els.ny.value=5;els.nr.value=2;
  upd();
}

ids.forEach(function(id){els[id].addEventListener('input',upd)});
upd();
</script>
</body>
</html>
